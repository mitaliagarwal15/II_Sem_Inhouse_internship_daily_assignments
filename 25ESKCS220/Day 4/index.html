<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <button id="darkBtn">Dark Mode</button>

    <h1>Registration Form</h1>

    <form id="form">

        <label>Name:</label><br>
        <input type="text" id="name" placeholder="Enter Name">
        <p id="nameError"></p>

        <label>Email:</label><br>
        <input type="email" id="email" placeholder="Enter Email">
        <p id="emailError"></p>

        <label>Phone:</label><br>
        <input type="tel" placeholder="Enter Phone"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>DOB:</label><br>
        <input type="date"><br><br>

        <label>Department:</label><br>
        <input type="checkbox"> CSE
        <input type="checkbox"> AI
        <input type="checkbox"> IT
        <br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter Password"><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" placeholder="Confirm Password"><br><br>

        <button type="submit">Register</button>

    </form>

    <hr>

    <h2>Click Counter</h2>

    <p>Total Clicks: <span id="count">0</span></p>

    <button type="button" id="clickBtn">Click Me</button>

    <button type="button" id="resetBtn">Reset</button>

    <script src="script.js"></script>

</body>
</html>
